name: Version Tracker
version: "1.0.0"
slug: version_tracker
description: Shows new GitHub/GitLab releases and machines that need updates in Settings → Updates
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:package-up
panel_title: Version Tracker
services:
  - mqtt:want
options:
  check_interval_hours: 6
  stale_hours: 24
  github_token: ""
  gitlab_tokens: []
  discovery_prefix: homeassistant
schema:
  check_interval_hours: int(1,168)
  stale_hours: int(1,720)
  github_token: password?
  gitlab_tokens:
    - host: str
      token: password
  discovery_prefix: str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
